name: Build and Deploy Doxygen Docs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-doxygen
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-graphviz
            mingw-w64-x86_64-texlive-bin
            mingw-w64-x86_64-texlive-core
            mingw-w64-x86_64-texlive-latex-recommended
            mingw-w64-x86_64-texlive-latex-extra
            mingw-w64-x86_64-texlive-plain-generic
            mingw-w64-x86_64-texlive-fonts-recommended
            mingw-w64-x86_64-texlive-extra-utils
            mingw-w64-x86_64-ghostscript
            bison
            flex

      - name: Install Pandoc
        run: choco install pandoc -y
        shell: pwsh

      - name: Copy FlexLexer.h to MinGW64 include path
        run: cp /usr/include/FlexLexer.h /mingw64/include/
        shell: msys2 {0}

      - name: Configure project
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DGENERATE_DOCS=ON -DGENERATE_USER_GUIDE=ON ..
        shell: msys2 {0}

      - name: Build project
        run: |
          cd build
          cmake --build . --config Release
        shell: msys2 {0}

      - name: Generate User Guide PDF
        run: |
          /c/ProgramData/chocolatey/bin/pandoc.exe docs/user_guide.md \
            --metadata-file=build/docs/user_guide_meta.yaml \
            --pdf-engine=xelatex \
            --toc --toc-depth=2 \
            --number-sections \
            -V geometry:margin=1in \
            -V fontsize=11pt \
            -V documentclass=report \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue \
            -o build/docs/nsbaci_user_guide.pdf
        shell: msys2 {0}

      - name: Build Doxygen documentation
        run: |
          cd build
          doxygen -u Doxyfile
          doxygen Doxyfile
        shell: msys2 {0}

      - name: Generate Codebase Reference PDF
        run: |
          if [ -d "docs/latex" ]; then
            cd docs/latex
            pdflatex --shell-escape refman.tex
            pdflatex --shell-escape refman.tex
            mkdir -p ../html/pdf
            cp refman.pdf ../html/pdf/nsbaci_codebase_reference.pdf
          fi
        shell: msys2 {0}

      - name: Copy User Guide PDF to docs
        run: |
          mkdir -p docs/html/pdf
          cp build/docs/nsbaci_user_guide.pdf docs/html/pdf/
        shell: msys2 {0}

      - name: Deploy documentation to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
          publish_branch: gh-pages
          cname: nsbaci.nicolasserranogarcia.com
          force_orphan: true